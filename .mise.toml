[tools]
node = "24"
bun = "1.3.14"

[tasks.install]
run = "npm install"
description = "Install npm dependencies"

[tasks.build]
run = "npm run build"
description = "Build TypeScript project"

[tasks.test]
run = "npm test"
description = "Run tests"

[tasks.lint]
run = "npm run lint"
description = "Run ESLint"

[tasks.format]
run = "npm run format"
description = "Format code with Prettier"

[tasks.check]
run = ["npm run lint", "npm run format:check", "npm test", "node scripts/bump-version.mjs --check"]
description = "Run all checks (lint, format, test, version)"

[tasks.mcpb]
run = "node scripts/build-mcpb.mjs"
description = "Build the .mcpb bundle for Claude Desktop / Claude Code"

[tasks.binary]
run = "node scripts/build-binary.mjs"
description = "Build standalone macOS binaries via Bun"
